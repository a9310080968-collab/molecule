name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: molecule-production-demo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Audit western-facing content
        run: pnpm audit:western

      - name: Build
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          VITE_APP_MODE: "demo"

      - name: Write deployment version
        run: |
          printf '{"sha":"%s","deployedAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/version.json

      - name: Deploy to mlcule.com
        env:
          SSHPASS: ${{ secrets.REG_RU_SSH_PASSWORD }}
          REG_RU_SSH_HOST: ${{ secrets.REG_RU_SSH_HOST }}
          REG_RU_SSH_USER: ${{ secrets.REG_RU_SSH_USER }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          SSH_TARGET="${REG_RU_SSH_USER}@${REG_RU_SSH_HOST}"
          SSH_OPTIONS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
          DEPLOY_DIR="www/mlcule.com/molecule"

          sshpass -e ssh ${SSH_OPTIONS} "${SSH_TARGET}" \
            "mkdir -p '${DEPLOY_DIR}' && find '${DEPLOY_DIR}' -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +"
          sshpass -e scp ${SSH_OPTIONS} -r dist/. "${SSH_TARGET}:${DEPLOY_DIR}/"

      - name: Publish to gh-pages
        run: |
          rm -rf /tmp/molecule-pages
          mkdir -p /tmp/molecule-pages
          cp -R dist/. /tmp/molecule-pages/
          touch /tmp/molecule-pages/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/molecule-pages/. .
          git add .
          git commit -m "Publish GitHub Pages demo"
          git push --force origin gh-pages
