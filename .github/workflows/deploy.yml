name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Publish to gh-pages
        run: |
          rm -rf /tmp/molecule-pages
          mkdir -p /tmp/molecule-pages
          cp -R dist/. /tmp/molecule-pages/
          touch /tmp/molecule-pages/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/molecule-pages/. .
          git add .
          git commit -m "Publish GitHub Pages demo"
          git push --force origin gh-pages
